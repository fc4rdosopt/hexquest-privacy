<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HexQuest — Privacy Policy & Terms</title>

    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #202124;
            --secondary: #5f6368;
            --accent: #5b4bdb;
            --border: #e1e3e8;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 35px 20px 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: var(--secondary);
        }

        .language-selector {
            margin-top: 22px;
        }

        .language-selector button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            padding: 8px 12px;
            margin: 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .language-selector button:hover {
            border-color: var(--accent);
        }

        .language-selector button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        nav {
            margin-top: 18px;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
            margin: 0 12px;
            font-weight: 600;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 18px;
        }

        section {
            background: var(--card);
            padding: 28px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        h2 {
            margin-top: 0;
            font-size: 25px;
        }

        h3 {
            margin-top: 28px;
            font-size: 19px;
        }

        ul {
            padding-left: 24px;
        }

        a {
            color: var(--accent);
        }

        .updated {
            color: var(--secondary);
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: var(--secondary);
            font-size: 14px;
            padding: 25px 15px 40px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            section {
                padding: 21px;
            }

            nav a {
                display: inline-block;
                margin: 5px 8px;
            }

            .language-selector button {
                padding: 7px 9px;
                font-size: 13px;
            }
        }
    </style>
</head>

function setLanguage(lang) {

    const t = translations[lang];

    if (!t) return;

    document.documentElement.lang = t.lang;

    document.getElementById("subtitle").textContent = t.subtitle;

    document.getElementById("navPrivacy").textContent = t.privacyNav;

    document.getElementById("navTerms").textContent = t.termsNav;

    document.getElementById("privacyTitle").textContent = t.privacyTitle;

    document.getElementById("termsTitle").textContent = t.termsTitle;

    document.getElementById("privacyDate").textContent = t.updated;

    document.getElementById("termsDate").textContent = t.updated;

    document.getElementById("privacyContent").innerHTML = t.privacy;

    document.getElementById("termsContent").innerHTML = t.terms;

    document.getElementById("footer").textContent = t.footer;


    document.querySelectorAll(".language-selector button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.lang === lang
            );

        });


    localStorage.setItem("hexquest-language", lang);
}


function detectLanguage() {

    const savedLanguage =
        localStorage.getItem("hexquest-language");

    if (savedLanguage && translations[savedLanguage]) {
        return savedLanguage;
    }


    const browserLanguage =
        navigator.language.toLowerCase();


    if (browserLanguage.startsWith("pt")) return "pt";

    if (browserLanguage.startsWith("es")) return "es";

    if (browserLanguage.startsWith("fr")) return "fr";

    if (browserLanguage.startsWith("it")) return "it";

    if (browserLanguage.startsWith("de")) return "de";

    return "en";
}


setLanguage(detectLanguage());
